name: ANSI2.0 map

# Rebuilds the AniList -> ANSI2.0 map and uploads it to Cloudflare KV.
# Runs weekly and can be started by hand (Actions -> ANSI2.0 map -> Run workflow).
# The first run takes hours; if it hits GitHub's time limit just run it again, it continues from the cache.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ansi-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore progress
        uses: actions/cache/restore@v4
        with:
          path: ansi-map/build-map.cache.json
          key: ansi-map-cache-${{ github.run_id }}
          restore-keys: ansi-map-cache-

      - name: Build map
        working-directory: ansi-map
        env:
          REFRESH: '1'
        run: node build-map.mjs

      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ansi-map/build-map.cache.json
          key: ansi-map-cache-${{ github.run_id }}

      - name: Upload to Cloudflare KV
        working-directory: ansi-map
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 kv bulk put ansi-map-kv.json --namespace-id=${{ secrets.ANSI_MAP_KV_ID }} --remote

      - name: Unmatched entries (for manual review)
        uses: actions/upload-artifact@v4
        with:
          name: ansi-unmatched
          path: ansi-map/ansi-unmatched.json
